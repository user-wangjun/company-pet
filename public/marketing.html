      .intro { position:absolute; z-index:25; bottom:4%; left:50%; display:grid; min-width:250px; padding:10px 17px; border:1px solid rgba(255,255,255,.35); border-radius:16px; background:rgba(9,22,86,.54); color:#fff; text-align:center; transform:translateX(-50%); transition:opacity .35s,transform .5s; }

      .controls.show { opacity:1; pointer-events:auto; }
      .controls button { display:grid; width:34px; aspect-ratio:1; place-items:center; border:1px solid rgba(255,255,255,.24); border-radius:50%; background:rgba(255,255,255,.12); color:#fff; cursor:pointer; }

      .constellation { position:absolute; z-index:2; inset:0; width:100%; height:100%; pointer-events:none; }
      .constellation line { stroke:var(--route); stroke-width:1; stroke-linecap:round; stroke-dasharray:3 6; opacity:.62; vector-effect:non-scaling-stroke; filter:drop-shadow(0 0 3px var(--route)); animation:route-flow 3.8s linear infinite; }
      .constellation circle { fill:#fff9bd; filter:drop-shadow(0 0 3px var(--route)); }
      @keyframes route-flow { to{stroke-dashoffset:-6.8} }
      .encounter { --enc:#ff9fc8;--enc2:#8fdcff;position:absolute;z-index:29;top:5%;right:3.2%;display:none;width:min(250px,24vw);justify-items:center;padding:15px 18px 13px;border:1px solid rgba(255,255,255,.45);border-radius:22px;background:linear-gradient(145deg,rgba(8,23,92,.74),rgba(37,29,112,.58));color:#fff;text-align:center;backdrop-filter:blur(16px); }

      .encounter>em { color:var(--enc);font-size:7px;font-style:normal;font-weight:900;letter-spacing:.16em; }

      .encounter-stage b { font-size:28px;text-shadow:0 0 10px var(--enc);animation:encounter-glyph 1.8s ease-in-out infinite; }

      .encounter[data-kind="slow-breath"]{--enc:#c5a8ff}.encounter[data-kind="water-drop"]{--enc:#7de2ff}.encounter[data-kind="cat-purr"]{--enc:#ffbb72}.encounter[data-kind="world-heart"]{--enc:#ff75ad}.encounter[data-kind="mint-breath"]{--enc:#7fe7c8}.encounter[data-kind="orbit-spark"]{--enc:#dff47e}.encounter[data-kind="crystal-chime"]{--enc:#aa8cff}.encounter[data-kind="rose-echo"]{--enc:#ff91c5}.encounter[data-kind="whale-wave"]{--enc:#80d9ff}.encounter[data-kind="leaf-flutter"]{--enc:#9de69d}.encounter[data-kind="home-signal"]{--enc:#78d8ab}.encounter[data-kind="energy-bounce"]{--enc:#ff8db9}

      .toast.show { opacity:1; transform:translate(-50%,0); }
      @media(max-width:700px){ header{height:64px;padding:0 14px}.viewport{top:64px}.brand small,nav small,nav .hide-mobile{display:none}.brand strong{font-size:21px}nav a,nav button{min-width:36px;padding:3px}.download{min-width:44px!important}.hero-title{width:62%}.card{right:3.5%;bottom:3%;left:3.5%;width:auto;padding:14px 16px}.card span{display:none}.controls{top:3%;right:50%;bottom:auto;transform:translateX(50%)}.label{display:none}}
      @media(prefers-reduced-motion:reduce){.camera,.planet,.world,.pet,.pet::before,.pet i,.planet-art,.constellation line,.encounter *{animation:none!important;transition-duration:1ms!important}}
    </style>

    <script>
      (() => {
        const particleCanvas=document.getElementById('star-particles'),particleContext=particleCanvas.getContext('2d'),reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
        let particleWidth=0,particleHeight=0,particleFrame=0,stars=[];
        const resizeParticles=()=>{const r=particleCanvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);particleWidth=r.width;particleHeight=r.height;particleCanvas.width=Math.round(particleWidth*d);particleCanvas.height=Math.round(particleHeight*d);particleContext.setTransform(d,0,0,d,0,0);stars=Array.from({length:Math.max(42,Math.round(particleWidth*particleHeight/12800))},(_,i)=>({x:Math.random()*particleWidth,y:Math.random()*particleHeight*.88,r:i%17===0?2.1+Math.random()*1.4:.55+Math.random()*1.2,p:Math.random()*Math.PI*2,s:.45+Math.random()*1.15,d:(Math.random()-.5)*.045,w:i%7===0}))};
        const drawParticles=t=>{particleContext.clearRect(0,0,particleWidth,particleHeight);stars.forEach(s=>{const p=reduceMotion?.72:.42+Math.sin(t*.001*s.s+s.p)*.34;s.y+=reduceMotion?0:s.d;if(s.y< -5)s.y=particleHeight*.88;if(s.y>particleHeight*.9)s.y=0;const c=s.w?'255,226,139':'221,239,255';particleContext.beginPath();particleContext.fillStyle=`rgba(${c},${Math.max(.14,p)})`;particleContext.shadowColor=`rgba(${c},${Math.max(.2,p)})`;particleContext.shadowBlur=s.r>2?12:5;particleContext.arc(s.x,s.y,s.r,0,Math.PI*2);particleContext.fill();if(s.r>2){particleContext.strokeStyle=`rgba(${c},${p*.72})`;particleContext.lineWidth=.75;particleContext.beginPath();particleContext.moveTo(s.x-s.r*3.4,s.y);particleContext.lineTo(s.x+s.r*3.4,s.y);particleContext.moveTo(s.x,s.y-s.r*3.4);particleContext.lineTo(s.x,s.y+s.r*3.4);particleContext.stroke()}});if(!reduceMotion)particleFrame=requestAnimationFrame(drawParticles)};
        resizeParticles();drawParticles(0);addEventListener('resize',resizeParticles);
        const entities = [
          ["honey-ring","planet","蜜糖星环","甜梦轨道 · 01","轻轻靠近，它会把今天积攒的小疲惫变成一圈暖黄色的星光。",14.6,21.5,10,1.58,"#ffd58a","honey ring"],
          ["lavender-moon","planet","薰衣草月","安静信号 · 02","一颗适合发呆的小月亮。停留片刻，宇宙也会跟着慢下来。",24.7,18.1,5.6,1.88,"#bda0ff",""],

          ["xiaoju","character","小橘","桌面陪伴员 · 04","趴在星球边缘偷偷看你。点击、双击或拖动时，它会用自己的方式回应。",35.8,22.3,11.5,1.62,"#ffb15f","xiaoju"],

          ["mint-moon","planet","薄荷月","呼吸坐标 · 06","像一颗漂浮的深呼吸按钮，让紧绷的节奏暂时松开一点。",69.2,19.1,5.8,1.9,"#8ce1c6","mint"],

          ["rose-moon","planet","玫瑰月","温柔回声 · 09","今天对自己说过的好话，会在这里变成柔软的粉色回声。",92,36.2,6.9,1.8,"#ff9dcc","rose"],
          ["orbit-bunny","character","ds","云海巡游员 · 10","圆滚滚的小鲸鱼沿着发光轨道巡游，发现你时会开心地跃起回应。",85.5,51.7,9.6,1.7,"#ffc1dd","ds"],
          ["ufo-bunny","character","蒜鸟","轻松领航员 · 11","扑扑翅膀、晃晃蒜叶，把工作间隙里短短的快乐稳稳送到你身边。",14.5,68.4,10.5,1.65,"#7ed4ff","suan"],
          ["tiny-earth","planet","口袋地球","微型故乡 · 12","再远的旅程也可以带着熟悉感。这颗小星球负责保存安心。",30.4,79.4,7.8,1.72,"#8edca8","earth"],
          ["heart-station","character","ikun","活力球场 · 13","抱着篮球守在下一站入口，点击靠近时，会把今天的元气稳稳传给你。",76,73.5,12,1.5,"#ff88b7","ikun"]

          "honey-ring":["warm-pulse","蜜糖光环正在升温","沿着光带移动鼠标，收下一点暖意","✦"],"lavender-moon":["slow-breath","和月亮慢慢呼吸","吸气四秒，呼气四秒","◌"],"blue-moon":["water-drop","蓝莓补给已经抵达","这一站，记得喝一口水","●"],xiaoju:["cat-purr","小橘发现你了","它眨眨眼，把呼噜声送进星光里","ฅ"],"yuxin-world":["world-heart","愈心星球与你同频","每一次回应，都在这里留下微光","♥"],"mint-moon":["mint-breath","薄荷气流经过","放松肩膀，给自己一个深呼吸","≈"],"lime-ring":["orbit-spark","青柠航线点亮","跟随轨道，启动今天的一小步","↗"],"violet-moon":["crystal-chime","灵感正在结晶","把刚刚闪过的念头轻轻接住","◆"],"rose-moon":["rose-echo","温柔回声返回","今天也请对自己说一句好话","♡"],"orbit-bunny":["whale-wave","ds 跃过星浪","它沿着蓝莓月的引力向你靠近","⌁"],"ufo-bunny":["leaf-flutter","蒜鸟发来轻松信号","从口袋地球带回一阵清爽的风","♧"],"tiny-earth":["home-signal","故乡信号已连接","无论多远，都能找到安心的坐标","⌂"],"heart-station":["energy-bounce","ikun 投递元气","玫瑰月为这一球加上温柔的弧线","●"]
        };
        const companionLinks=[["xiaoju","honey-ring","#ffc06f"],["orbit-bunny","blue-moon","#86d9ff"],["ufo-bunny","tiny-earth","#9ee6b0"],["heart-station","rose-moon","#ff9fc8"]];
        const viewport=document.getElementById('viewport'),camera=document.getElementById('camera'),objects=document.getElementById('objects'),card=document.getElementById('card'),controls=document.getElementById('controls'),current=document.getElementById('current'),encounter=document.getElementById('encounter'),constellation=document.getElementById('constellation');
        companionLinks.forEach(([characterId,planetId,accent])=>{const c=entities.find(e=>e.id===characterId),p=entities.find(e=>e.id===planetId);if(!c||!p)return;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.style.setProperty('--route',accent);g.innerHTML=`<line x1="${p.x}" y1="${p.y}" x2="${c.x}" y2="${c.y}"></line><circle cx="${(p.x+c.x)/2}" cy="${(p.y+c.y)/2}" r=".42"></circle>`;constellation.appendChild(g)});
        let active=null;
        const visual=(e)=>{if(e.visual==='world')return '<span class="world"><img class="world-art" src="./marketing-assets/healing-world-v2.png" alt=""><i class="wring"></i></span>';if(e.kind==='character')return `<span class="pet ${e.visual}"><i></i></span>`;const source=e.visual.includes('honey')||e.visual.includes('lime')?'planet-honey-v2.png':e.visual.includes('earth')?'planet-earth-v2.png':'planet-moon-v2.png';return `<span class="planet ${e.visual}"><img class="planet-art" src="./marketing-assets/${source}" alt="">${e.visual.includes('ring')?'<i></i>':''}</span>`};
        entities.forEach(e=>{const b=document.createElement('button');b.className='object';b.dataset.entityId=e.id;b.setAttribute('aria-label',`探索${e.name}`);b.style.cssText=`left:${e.x}%;top:${e.y}%;width:${e.size}%;--accent:${e.accent}`;b.innerHTML=visual(e)+`<i class="focus-ring"></i><span class="label"><small>${e.eyebrow}</small><strong>${e.name}</strong></span>`;b.onclick=(ev)=>{ev.stopPropagation();focus(e)};objects.appendChild(b)});
        function focus(e){active=e;viewport.classList.toggle('focused',!!e);camera.dataset.cameraTarget=e?.id||'overview';camera.style.setProperty('--cs',e?.zoom||1);camera.style.setProperty('--cx',e?`${50-e.x*e.zoom}%`:'0%');camera.style.setProperty('--cy',e?`${51-e.y*e.zoom}%`:'0%');objects.querySelectorAll('.object').forEach(b=>b.classList.toggle('active',b.dataset.entityId===e?.id));if(!e){card.classList.remove('show');controls.classList.remove('show');encounter.classList.remove('show');card.innerHTML='';return}const i=entities.indexOf(e),interaction=interactions[e.id];card.innerHTML=`<small>${String(i+1).padStart(2,'0')} — ${String(entities.length).padStart(2,'0')}</small><p>${e.eyebrow}</p><h2>${e.name}</h2><span>${e.description}</span><button id="reset">↙ 返回宇宙全景</button>`;card.classList.add('show');controls.classList.add('show');current.textContent=e.name;encounter.dataset.kind=interaction[0];document.getElementById('encounter-title').textContent=interaction[1];document.getElementById('encounter-cue').textContent=interaction[2];document.getElementById('encounter-glyph').textContent=interaction[3];encounter.classList.remove('show');void encounter.offsetWidth;encounter.classList.add('show');document.getElementById('reset').onclick=()=>focus(null)}
        const adjacent=d=>{const i=entities.findIndex(e=>e.id===active?.id),s=i<0?(d>0?-1:0):i;return entities[(s+d+entities.length)%entities.length]};
        document.getElementById('prev').onclick=()=>focus(adjacent(-1));document.getElementById('next').onclick=()=>focus(adjacent(1));
        viewport.onpointermove=e=>{if(e.pointerType==='touch')return;const r=viewport.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;camera.style.setProperty('--look-x',`${-x*2}%`);camera.style.setProperty('--look-y',`${-y*1.4}%`);viewport.style.setProperty('--pet-look-x',`${x*7}px`);viewport.style.setProperty('--pet-look-y',`${y*5}px`)};
        viewport.onpointerleave=()=>{camera.style.setProperty('--look-x','0%');camera.style.setProperty('--look-y','0%');viewport.style.setProperty('--pet-look-x','0px');viewport.style.setProperty('--pet-look-y','0px')};
        window.onkeydown=e=>{if(e.key==='Escape')focus(null);if(['ArrowRight','ArrowDown'].includes(e.key))focus(adjacent(1));if(['ArrowLeft','ArrowUp'].includes(e.key))focus(adjacent(-1))};
        const toast=document.getElementById('toast');document.querySelectorAll('.pending,#wechat').forEach(b=>b.onclick=()=>{toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)});
        document.getElementById('download').onclick=()=>window.open('../releases/yuxin-desktop-pet-0.3.0-windows-x64-setup.exe','_blank','noopener,noreferrer');
      })();
